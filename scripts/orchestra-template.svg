<svg width="960" height="460" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Polycentric AI orchestration with human conductor, agents, evidence, debate, and runtime feedback</title>
  <desc id="desc">An animated systems diagram styled like a professional race team. A human conductor directs specialized agents. Legislative, executive, and judicial roles propose, build, review, disagree, appeal, and overrule one another. A nine-stage illustrative cycle preserves dissent, revises the work, checks runtime evidence, and returns to human decision. It is a scored illustration, not live telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05090d"/>
      <stop offset="0.5" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#071218"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="0.23" stop-color="#ffbe6b"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.06"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset="0.24" stop-color="#00ffd1"/>
      <stop offset="1" stop-color="#00ffd1" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#f7edff"/>
      <stop offset="0.24" stop-color="#bd8cff"/>
      <stop offset="1" stop-color="#9d5cff" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6af7e0" stroke-opacity="0.055"/>
    </pattern>
    <path id="intentPath" d="M110 224 L480 224"/>
    <path id="legPath" d="M480 224 C430 150 372 126 316 116"/>
    <path id="execPath" d="M480 224 C562 155 632 130 700 116"/>
    <path id="judgePath" d="M480 224 C480 292 480 324 480 356"/>
    <path id="legExec" d="M330 126 C448 78 594 78 686 126"/>
    <path id="execJudge" d="M704 134 C682 246 620 324 512 356"/>
    <path id="judgeLeg" d="M448 356 C334 322 278 244 304 140"/>
    <path id="runtimePath" d="M700 116 C790 132 842 184 842 246 C842 342 740 406 480 406 C242 406 118 344 118 258 C118 244 120 236 126 226"/>
  <path id="evidencePath" d="M110 224 C160 350 270 380 480 356"/>
    <path id="acceptPath" d="M480 356 L480 224"/>
  </defs>
  <style>.static-caption{display:none}@media(prefers-reduced-motion:reduce){.stage{display:none}.static-caption{display:block}}</style>

  <rect width="960" height="460" rx="24" fill="url(#bg)"/>
  <rect width="960" height="460" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="458" rx="23" fill="none" stroke="#00ffd1" stroke-opacity="0.28"/>

  <g font-family="Consolas, Monaco, monospace">
    <text x="38" y="42" fill="#00ffd1" font-size="12" opacity="0.74">POLYCENTRIC CYBERNETIC ORCHESTRATION</text>
    <text x="38" y="61" fill="#a5b6c8" font-size="10">authority distributed · disagreement preserved · evidence returns</text>
    <text x="922" y="42" text-anchor="end" fill="#ffbe6b" font-size="11">HUMAN IN THE LOOP</text>
  </g>

  <g opacity="0.24" filter="url(#soft)">
    <circle cx="480" cy="224" r="78" fill="#ff9f4f"/>
    <circle cx="316" cy="116" r="52" fill="#00ffd1"/>
    <circle cx="700" cy="116" r="52" fill="#bd8cff"/>
    <circle cx="480" cy="356" r="52" fill="#00ffd1"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <use href="#intentPath" stroke="#10323a" stroke-width="18"/>
    <use href="#intentPath" stroke="#00ffd1" stroke-width="3" opacity="0.86" filter="url(#glow)"/>
    <use href="#legPath" stroke="#32291d" stroke-width="16"/>
    <use href="#execPath" stroke="#32291d" stroke-width="16"/>
    <use href="#judgePath" stroke="#32291d" stroke-width="16"/>
    <use href="#legPath" stroke="#ffbe6b" stroke-width="3" opacity="0.82"/>
    <use href="#execPath" stroke="#ffbe6b" stroke-width="3" opacity="0.82"/>
    <use href="#judgePath" stroke="#ffbe6b" stroke-width="3" opacity="0.82"/>
    <use href="#legExec" stroke="#bd8cff" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8"/>
    <use href="#execJudge" stroke="#00ffd1" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8"/>
    <use href="#judgeLeg" stroke="#ff6f91" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8"/>
    <use href="#runtimePath" stroke="#102a31" stroke-width="14"/>
    <use href="#runtimePath" stroke="#6af7e0" stroke-width="2.4" opacity="0.62"/>
  </g>

  <g font-family="Consolas, Monaco, monospace" text-anchor="middle">
    <g transform="translate(110 224)">
      <circle r="35" fill="#07151a" stroke="#00ffd1" stroke-opacity="0.72"/>
      <circle r="9" fill="url(#cyan)" filter="url(#glow)"></circle>
      <text y="54" fill="#dffcf8" font-size="11" font-weight="700">INTENT</text>
      <text y="70" fill="#8fa8b6" font-size="9">goal + constraints</text>
    </g>

    <g transform="translate(480 224)">
      <circle r="54" fill="#171009" stroke="#ffbe6b" stroke-opacity="0.78" stroke-width="2"/>
      <circle r="18" fill="url(#hub)" filter="url(#glow)"></circle>
      <path d="M-16 -4 Q0 -22 16 -4 M-12 10 Q0 22 12 10" fill="none" stroke="#fff3d8" stroke-width="2" opacity="0.9"/>
      <text y="72" fill="#ffd59d" font-size="12" font-weight="700">CONDUCTOR</text>
      <text y="88" fill="#9ca8b2" font-size="9">direction · coherence · acceptance</text>
    </g>

    <g transform="translate(316 116)">
      <circle r="42" fill="#07151a" stroke="#00ffd1" stroke-opacity="0.74"/>
      <circle r="11" fill="url(#cyan)" filter="url(#glow)"/>
      <text y="3" fill="#eafffb" font-size="10" font-weight="700">LEGISLATIVE</text>
      <text y="58" fill="#91a7b5" font-size="9">propose · define · constrain</text>
    </g>

    <g transform="translate(700 116)">
      <circle r="42" fill="#120d18" stroke="#bd8cff" stroke-opacity="0.82"/>
      <circle r="11" fill="url(#violet)" filter="url(#glow)"/>
      <text y="3" fill="#f5eaff" font-size="10" font-weight="700">EXECUTIVE</text>
      <text y="58" fill="#a89bb5" font-size="9">build · act · report</text>
    </g>

    <g transform="translate(480 356)">
      <circle r="42" fill="#07151a" stroke="#00ffd1" stroke-opacity="0.74"/>
      <circle r="11" fill="url(#cyan)" filter="url(#glow)"/>
      <text y="3" fill="#eafffb" font-size="10" font-weight="700">JUDICIAL</text>
      <text y="58" fill="#91a7b5" font-size="9">test · interpret · overrule</text>
    </g>
  </g>

  <g font-family="Consolas, Monaco, monospace" font-size="9" font-weight="700">
    <g transform="translate(500 76)"><rect x="-42" y="-11" width="84" height="22" rx="11" fill="#120d18" stroke="#bd8cff" stroke-opacity="0.5"/><text text-anchor="middle" y="3" fill="#d9bfff">PROPOSAL</text></g>
    <g transform="translate(668 260)"><rect x="-36" y="-11" width="72" height="22" rx="11" fill="#07151a" stroke="#00ffd1" stroke-opacity="0.5"/><text text-anchor="middle" y="3" fill="#8effec">REVIEW</text></g>
    <g transform="translate(287 264)"><rect x="-42" y="-11" width="84" height="22" rx="11" fill="#1a0c12" stroke="#ff6f91" stroke-opacity="0.55"/><text text-anchor="middle" y="3" fill="#ff9eb5">DISSENT</text></g>
    <g transform="translate(842 246)"><rect x="-44" y="-12" width="88" height="24" rx="12" fill="#07151a" stroke="#6af7e0" stroke-opacity="0.55"/><text text-anchor="middle" y="3" fill="#b9fff3">RUNTIME</text></g>
  </g>

<text class="static-caption" x="38" y="447" font-family="Consolas,monospace" font-size="11" fill="#8effec">Intent → proposal → build → review → dissent → revision → evidence → human decision</text>
  <!-- SCORE -->
</svg>
